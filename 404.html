    --navy: #0a0e27;
    --navy-deep: #05070f;

  *{ box-sizing:border-box; }
  body{

    display:flex;
    align-items:center;

    background:var(--off-white);

  .wrap{ max-width:560px; text-align:center; }
  .logo{
    font-family:'Inter', sans-serif;
    font-weight:700;
    letter-spacing:0.04em;
    font-size:13px;
    color:var(--navy);

  }
  .logo .logo-sub{ display:block; font-size:10px; letter-spacing:0.16em; color:var(--gray); font-weight:600; }
  .code{

    line-height:1;

    line-height:1.6;
    color:var(--gray);
    margin:0 0 36px;
  }
  .links{
    text-align:left;
    border-top:1px solid var(--line-dark);
    padding-top:24px;
  }
  .links p.label{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--gray);
    font-weight:600;
    margin:0 0 14px;
  }
  .links ul{ list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  .links a{
    text-decoration:none;
    font-size:14.5px;
    font-weight:500;
    color:var(--navy-deep);
    border-bottom:1px solid transparent;
  }
  .links a:hover{ border-bottom-color:var(--navy-deep); }
  .home-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--navy-deep);
    color:#fff;
    font-size:13.5px;
    font-weight:600;
    padding:12px 20px;
    border-radius:9px;
